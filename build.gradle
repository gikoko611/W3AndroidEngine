buildscript {
    repositories {
        mavenLocal()
		flatDir {
			dirs "$rootProject.projectDir/jars"
		}
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://maven.nikr.net/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.5.1"
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "warsmash"
        gdxVersion = '1.14.2'
        antlrVersion = '4.13.2'
        xstreamVersion = '1.4.21'
        guavaVersion = '33.8.0-jre'
        commonsCompressVersion = '1.28.0'
        commonsIoVersion = '2.22.0'
    }

    repositories {
        mavenLocal()
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://maven.nikr.net/" }
        maven { url = "https://jitpack.io" }
    }
}

project(":server") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":shared")
        api "com.thoughtworks.xstream:xstream:$xstreamVersion"
        api "commons-codec:commons-codec:1.23.0"
    }
}

project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        api "com.google.guava:guava:$guavaVersion"
        api "org.apache.commons:commons-compress:$commonsCompressVersion"
        api "commons-io:commons-io:$commonsIoVersion"
        api "net.nikr:dds:1.0.0"
        implementation "org.bytedeco:ffmpeg:8.1.2-1.5.14"
        // The decoder's native libraries only for Windows x64; elsewhere the movies are skipped.
        runtimeOnly "org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64"
        runtimeOnly "org.bytedeco:javacpp:1.5.14:windows-x86_64"
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api project(":shared")
        api project(":fdfparser")
        api project(":jassparser")
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.google.guava:guava:$guavaVersion"
        api "org.apache.commons:commons-compress:$commonsCompressVersion"
        api "commons-io:commons-io:$commonsIoVersion"
        api "net.nikr:dds:1.0.0"
        api files(fileTree(dir:'../jars', includes: ['*.jar']))
    }
}

project(":shared") {
    apply plugin: "java-library"

    dependencies {
    }
}

project(":fdfparser") {
    apply plugin: "antlr"
    apply plugin: "java-library"

    dependencies {
        antlr "org.antlr:antlr4:$antlrVersion" // use antlr version 4
        api "org.antlr:antlr4-runtime:$antlrVersion"
    }

    // The antlr configuration is the code generator with ICU4J; the parsers only need the runtime.
    configurations.api.setExtendsFrom(configurations.api.extendsFrom.findAll { it.name != "antlr" })
}

project(":jassparser") {
    apply plugin: "antlr"
    apply plugin: "java-library"


    dependencies {
        implementation project(":shared")
        antlr "org.antlr:antlr4:$antlrVersion" // use antlr version 4
        api "org.antlr:antlr4-runtime:$antlrVersion"
    }

    configurations.api.setExtendsFrom(configurations.api.extendsFrom.findAll { it.name != "antlr" })
}

tasks.eclipse.doLast {
    delete ".project"
}
