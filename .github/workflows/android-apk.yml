name: Redmi 9A ARMv7 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARMv7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :android:assembleDebug

      - name: Verify ARMv7 native libraries and locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was produced."
            find android/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK contents (native libraries):"
          unzip -Z1 "$APK" | grep '^lib/' || true

          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/' || {
            echo "ERROR: ARMv7 native libraries are missing."
            exit 1
          }

          OTHER_ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1=="lib" && $2!="" && $2!="armeabi-v7a" {print $2}' | sort -u)"
          if [ -n "$OTHER_ABIS" ]; then
            echo "ERROR: Unexpected native ABIs found: $OTHER_ABIS"
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/GI-KO-KO-WARCRAFT-III-ARMv7-0.3.6-debug.apk
          ls -lh dist/

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-WARCRAFT-III-ARMv7-0.3.6
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
