name: Redmi 9A ARMv7 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARMv7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :android:assembleDebug

      - name: Verify ARMv7 native libraries
        shell: bash
        run: |
          APK="android/build/outputs/apk/debug/android-debug.apk"
          test -f "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'
          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "Unexpected ARM64 libraries found in the ARMv7-only APK."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/GI-KO-KO-WARCRAFT-III-ARMv7-0.3.6-debug.apk
          ls -lh dist/

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-WARCRAFT-III-ARMv7-0.3.6
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
